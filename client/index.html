<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <title>TaskHub</title>
    <meta name="description" content="TaskHub is a full-stack task and team management app — projects, Kanban boards, and role-based access, built with React, TypeScript, Express, and MongoDB." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TaskHub" />
    <meta property="og:description" content="A full-stack task and team management app — projects, Kanban boards, and role-based access, built with React, TypeScript, Express, and MongoDB." />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TaskHub" />
    <meta name="twitter:description" content="A full-stack task and team management app — projects, Kanban boards, and role-based access, built with React, TypeScript, Express, and MongoDB." />
    <script>
      (function () {
        var stored = localStorage.getItem('taskhub-theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
